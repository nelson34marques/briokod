services:
  - type: web
    name: briokod-api
    runtime: node
    # Plano free: adormece após ~15 min sem tráfego (o 1.º pedido demora a
    # acordar) e o sistema de ficheiros é efémero — a base SQLite reinicia a
    # cada deploy. Para persistir dados, muda para `starter` + o `disk` abaixo.
    plan: free
    buildCommand: npm install
    startCommand: npm run api
    healthCheckPath: /api/health
    # Só no plano pago (o free não suporta discos). Descomenta ao subir de plano:
    # disk:
    #   name: briokod-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # node:sqlite precisa de Node >= 24 (ver engines no package.json).
      - key: NODE_VERSION
        value: 24
      - key: PORT
        value: 3000
      # Tem de ligar em 0.0.0.0 em produção, senão o proxy do Render não alcança.
      - key: HOST
        value: 0.0.0.0
      # Relativo à raiz do projeto (escrevível no free). Se subires de plano,
      # muda para /var/data/briokod.db para guardar no disco persistente.
      - key: DATABASE_PATH
        value: data/briokod.db
      # O domínio do Vercel. Acrescenta previews (*.vercel.app) separados por
      # vírgula, ou usa "*" para aceitar qualquer origem (não recomendado).
      - key: CORS_ORIGIN
        value: https://briokod.vercel.app
      # Judge0 primeiro (execução real); mock é o último recurso garantido, para
      # o JS nunca dar 502. Sem judge0 alcançável, só o JS corre.
      - key: EXECUTORS
        value: judge0-ce,mock
      - key: FIREBASE_PROJECT_ID
        value: briokod
      # Necessário para Salas/Torneios (escrita no Firestore via Admin SDK).
      # Usa um Secret File em /etc/secrets/service-account.json, ou o caminho
      # para esse ficheiro. Sem isto, Salas/Torneios devolvem 400.
      - key: FIREBASE_ADMIN_CREDENTIALS
        sync: false
      - key: FIREBASE_ADMIN_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ADMIN_UIDS
        sync: false
